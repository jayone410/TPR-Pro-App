name: Update Economic Calendar

on:
  workflow_dispatch:

  schedule:
    - cron: "5,20,35,50 * * * *"

permissions:
  contents: write

jobs:

  update-calendar:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Download economic calendar
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

        run: |

          mkdir -p data

          FROM=$(date -u +"%Y-%m-%d")
          TO=$(date -u -d "+7 days" +"%Y-%m-%d")

          curl \
            --fail \
            --silent \
            --show-error \
            "https://financialmodelingprep.com/stable/economic-calendar?from=${FROM}&to=${TO}&apikey=${FMP_API_KEY}" \
            -o data/economic-calendar.json


      - name: Validate JSON
        run: |
          jq empty data/economic-calendar.json


      - name: Commit updated calendar
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/economic-calendar.json

          if git diff --cached --quiet; then

            echo "No calendar changes"

          else

            git commit -m "Update economic calendar"

            git push

          fi
