name: Update Economic Calendar

on:
  workflow_dispatch:

  schedule:
    - cron: "15 */3 * * *"

permissions:
  contents: write

jobs:

  update-calendar:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Download FRED release calendar
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

        run: |

          mkdir -p data

          TODAY=$(date -u +"%Y-%m-%d")
          TO=$(date -u -d "+7 days" +"%Y-%m-%d")

          echo "From: ${TODAY}"
          echo "To: ${TO}"

          curl \
            --fail \
            --silent \
            --show-error \
            "https://api.stlouisfed.org/fred/releases/dates?api_key=${FRED_API_KEY}&file_type=json&realtime_start=${TODAY}&realtime_end=${TO}&include_release_dates_with_no_data=true&limit=1000&sort_order=asc" \
            -o /tmp/fred-calendar.json


      - name: Convert FRED calendar
        run: |

          jq '
          [
            .release_dates[]
            |
            {
              date: .date,
              release_id: .release_id,
              release_name: .release_name
            }
          ]
          ' /tmp/fred-calendar.json \
          > data/economic-calendar.json


      - name: Validate JSON
        run: |

          jq empty data/economic-calendar.json

          echo "Calendar entries:"
          jq length data/economic-calendar.json


      - name: Commit updated calendar
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/economic-calendar.json

          if git diff --cached --quiet; then

            echo "No calendar changes"

          else

            git commit -m "Update economic calendar"

            git push

          fi
