name: Update Economic Calendar

on:
  workflow_dispatch:

  schedule:
    - cron: "5,20,35,50 * * * *"

permissions:
  contents: write

jobs:

  update-calendar:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Download economic calendar
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}

        run: |

          mkdir -p data

          FROM=$(date -u +"%Y-%m-%d")
          TO=$(date -u -d "+7 days" +"%Y-%m-%d")

          echo "From: ${FROM}"
          echo "To: ${TO}"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output /tmp/fmp-response.json \
            --write-out "%{http_code}" \
            "https://financialmodelingprep.com/stable/economic-calendar?from=${FROM}&to=${TO}&apikey=${FMP_API_KEY}")

          echo "HTTP Status: ${HTTP_CODE}"

          echo "API Response:"
          cat /tmp/fmp-response.json

          echo ""

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "FMP request failed."
            exit 1
          fi

          cp /tmp/fmp-response.json data/economic-calendar.json


      - name: Validate JSON
        run: |
          jq empty data/economic-calendar.json


      - name: Commit updated calendar
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/economic-calendar.json

          if git diff --cached --quiet; then

            echo "No calendar changes"

          else

            git commit -m "Update economic calendar"

            git push

          fi
